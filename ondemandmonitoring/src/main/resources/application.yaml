spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: ${SPRING_APPLICATION_NAME:ondemandmonitoring}
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    open-in-view: ${JPA_OPEN_IN_VIEW}
    properties:
      hibernate:
        dialect: ${JPA_HIBERNATE_DIALECT}
        format_sql: ${JPA_FORMAT_SQL}
    show-sql: ${JPA_SHOW_SQL}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}
  sql:
    init:
      mode: always

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:}
mybatis:
  mapper-locations: ${MYBATIS_MAPPER_LOCATIONS}
  type-aliases-package: ${MYBATIS_TYPE_ALIASES_PACKAGE}
  configuration:
    map-underscore-to-camel-case: ${MYBATIS_MAP_UNDERSCORE_TO_CAMEL_CASE}

server:
  port: ${SERVER_PORT}

aws:
  region: ${AWS_REGION}
  s3:
    access-key-bao: ${AWS_ACCESS_KEY_ID}
    secret-key-bao: ${AWS_SECRET_ACCESS_KEY}
    bucket: ${AWS_S3_BUCKET}
    prefix: ${AWS_S3_PREFIX}
  cognito:
    region: ${AWS_COGNITO_REGION}
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID:}
    client-id: ${AWS_COGNITO_CLIENT_ID:}
    client-secret: ${AWS_COGNITO_CLIENT_SECRET:}
    domain: ${AWS_COGNITO_DOMAIN:}

cors:
  address: ${CORS_ADDRESS}

auth:
  outbox:
    fixed-delay-ms: ${AUTH_OUTBOX_FIXED_DELAY_MS:30000}
    max-attempts: ${AUTH_OUTBOX_MAX_ATTEMPTS:8}
  refresh-token-cookie:
    secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
    max-age-seconds: ${AUTH_REFRESH_COOKIE_MAX_AGE_SECONDS:2592000}
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

app:
  seed:
    demo-drones: ${APP_SEED_DEMO_DRONES:false}
  media:
    orphan-cleanup:
      enabled: ${APP_MEDIA_ORPHAN_CLEANUP_ENABLED:true}
      delay-seconds: ${APP_MEDIA_ORPHAN_CLEANUP_DELAY_SECONDS:300}
      upload-grace-seconds: ${APP_MEDIA_ORPHAN_CLEANUP_UPLOAD_GRACE_SECONDS:900}
      fixed-delay-ms: ${APP_MEDIA_ORPHAN_CLEANUP_FIXED_DELAY_MS:60000}
    max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:26214400}
    max-video-bytes: ${MEDIA_MAX_VIDEO_BYTES:1073741824}
    sqs:
      enabled: ${MEDIA_SQS_ENABLED:false}
      queue-url: ${MEDIA_SQS_QUEUE_URL:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha


simulation:
  telemetry:
    max-age-seconds: ${SIMULATION_TELEMETRY_MAX_AGE_SECONDS:5}

omss:
  payment:
    deposit-rate: ${OMSS_PAYMENT_DEPOSIT_RATE:0.30}
    pending-payment-grace: ${OMSS_PENDING_PAYMENT_GRACE:30m}
    expiration-batch-size: ${OMSS_EXPIRATION_BATCH_SIZE:100}
    expiration-job-delay-ms: ${OMSS_EXPIRATION_JOB_DELAY_MS:60000}

odms:
  result-retention:
    cleanup:
      enabled: ${ODMS_RESULT_RETENTION_CLEANUP_ENABLED:true}
      cron: "${ODMS_RESULT_RETENTION_CLEANUP_CRON:0 15 * * * *}"
      batch-size: ${ODMS_RESULT_RETENTION_CLEANUP_BATCH_SIZE:100}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  query-url: ${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
  ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/payments/vnpay/ipn}
  frontend-result-url: ${PAYMENT_FRONTEND_RESULT_URL:http://localhost:5173/#payment/result}
  version: ${VNPAY_VERSION:2.1.0}
  command: ${VNPAY_COMMAND:pay}
  order-type: ${VNPAY_ORDER_TYPE:other}
  locale: ${VNPAY_LOCALE:vn}
  expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
  query-connect-timeout-ms: ${VNPAY_QUERY_CONNECT_TIMEOUT_MS:3000}
  query-read-timeout-ms: ${VNPAY_QUERY_READ_TIMEOUT_MS:5000}

# Customer weather preview (Open-Meteo, no API key). Thresholds are customer guidance only,
# NOT aviation safety limits. All values have code defaults in WeatherProperties.
weather:
  open-meteo:
    base-url: ${WEATHER_OPEN_METEO_BASE_URL:https://api.open-meteo.com}
    connect-timeout-ms: 2000
    read-timeout-ms: 4000
    max-forecast-days: 16
  cache:
    enabled: true
    ttl-minutes: 30
    max-entries: 500
  customer:
    caution:
      rain-probability-percent: 40
      wind-speed-kmh: 20
      wind-gust-kmh: 30
      visibility-meters: 3000
    poor:
      rain-probability-percent: 70
      wind-speed-kmh: 35
      wind-gust-kmh: 50
      visibility-meters: 1000

# Preliminary flight-area assessment (advisory only, rule-based; NOT legal or aviation limits).
# External providers are configuration only; every value has a code default in FlightAreaProperties.
flight-area-assessment:
  max-radius-m: ${FLIGHT_AREA_MAX_RADIUS_M:5000}
  ministry-flight-ban:
    base-url: ${MINISTRY_FLIGHT_BAN_BASE_URL:https://cambay.mod.gov.vn}
    path: ${MINISTRY_FLIGHT_BAN_PATH:/api/calculate-area}
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
    polygon-points: 64

